name: tests

on:
  push:
    branches: [dev]
    paths:
      - "hooks/**"
      - "tests/**"
      - "lib/utils.ts"
      - "vitest.config.*"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [dev]
    paths:
      - "hooks/**"
      - "tests/**"
      - "lib/utils.ts"
      - "vitest.config.*"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/test.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vitest (${{ matrix.browser }})
    runs-on: ubuntu-latest
    env:
      GITHUB_STEP_SUMMARY: /dev/null
    if: >-
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[ci skip]') &&
      !contains(github.event.head_commit.message, '[no ci]') &&
      !contains(github.event.pull_request.title, '[skip ci]') &&
      !contains(github.event.pull_request.title, '[ci skip]') &&
      !contains(github.event.pull_request.title, '[no ci]')
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: cache playwright browser (${{ matrix.browser }})
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: install playwright browser & deps (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: install playwright os deps only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps ${{ matrix.browser }}

      - name: run tests (${{ matrix.browser }})
        run: >-
          pnpm test:${{ matrix.browser }}
          --reporter=default
          --reporter=github-actions
          --reporter=json
          --outputFile.json=test-results-${{ matrix.browser }}.json

      - name: upload test results (${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results-${{ matrix.browser }}.json
          if-no-files-found: ignore
          retention-days: 1

  summary:
    name: test summary
    needs: test
    runs-on: ubuntu-latest
    if: always() && needs.test.result != 'skipped'
    steps:
      - name: download test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          merge-multiple: true

      - name: generate unified job summary
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");

            const summaryFile = process.env.GITHUB_STEP_SUMMARY;
            const browsers = ["chromium", "firefox", "webkit"];

            let md = `### vitest browser matrix\n\n`;
            md += `| browser | status | suites | passed | failed | skipped | duration |\n`;
            md += `| :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n`;

            const failures = [];

            for (const browser of browsers) {
              const file = `test-results-${browser}.json`;
              if (!fs.existsSync(file)) {
                md += `| \`${browser}\` | ⚠️ missing | - | - | - | - | - |\n`;
                continue;
              }

              const report = JSON.parse(fs.readFileSync(file, "utf8"));
              const status = report.success ? "✅ passed" : "❌ failed";
              const suites = report.testResults || [];
              const duration = (
                suites.reduce((acc, s) => acc + Math.max(0, (s.endTime || 0) - (s.startTime || 0)), 0) / 1000
              ).toFixed(2);

              md += `| \`${browser}\` | **${status}** | ${report.numPassedTestSuites}/${report.numTotalTestSuites} | ${report.numPassedTests} | ${report.numFailedTests} | ${report.numPendingTests} | ${duration}s |\n`;

              for (const suite of suites) {
                for (const test of suite.assertionResults || []) {
                  if (test.status === "failed") {
                    failures.push({
                      browser,
                      file: path.basename(suite.name),
                      title: test.fullName || test.title,
                      messages: (test.failureMessages || []).join("\n\n").trim(),
                    });
                  }
                }
              }
            }

            md += `\n`;

            for (const fail of failures) {
              md += `<details open>\n<summary>❌ <strong>[${fail.browser}] ${fail.file}</strong> — ${fail.title}</summary>\n\n`;
              md += "```text\n" + fail.messages + "\n```\n\n</details>\n\n";
            }

            fs.appendFileSync(summaryFile, md);
          '
