name: tests
on:
  push:
    branches: [dev]
    paths:
      - "hooks/**"
      - "tests/**"
      - "lib/utils.ts"
      - "vitest.config.*"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [dev]
    paths:
      - "hooks/**"
      - "tests/**"
      - "lib/utils.ts"
      - "vitest.config.*"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/test.yml"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: vitest (${{ matrix.browser }})
    runs-on: ubuntu-26.04
    if: >-
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[ci skip]') &&
      !contains(github.event.head_commit.message, '[no ci]') &&
      !contains(github.event.pull_request.title, '[skip ci]') &&
      !contains(github.event.pull_request.title, '[ci skip]') &&
      !contains(github.event.pull_request.title, '[no ci]')
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: setup node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: "pnpm"
      - name: install dependencies
        run: pnpm install --frozen-lockfile
      - name: cache playwright browser (${{ matrix.browser }})
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: install playwright browser & deps (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: install playwright os deps only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps ${{ matrix.browser }}
      - name: run tests (${{ matrix.browser }})
        run: pnpm test --project=${{ matrix.browser }}
