name: Tests

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Vitest (${{ matrix.browser }})
    runs-on: ubuntu-latest
    if: >-
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[ci skip]') &&
      !contains(github.event.head_commit.message, '[no ci]') &&
      !contains(github.event.pull_request.title, '[skip ci]') &&
      !contains(github.event.pull_request.title, '[ci skip]') &&
      !contains(github.event.pull_request.title, '[no ci]')
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browser (${{ matrix.browser }})
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser & deps (Cache Miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Install Playwright OS deps only (Cache Hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps ${{ matrix.browser }}

      - name: Run tests (${{ matrix.browser }})
        run: >-
          pnpm test:${{ matrix.browser }}
          --reporter=default
          --reporter=github-actions
          --reporter=json
          --outputFile.json=test-results.json

      - name: Generate Job Summary
        if: always()
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");

            const summaryFile = process.env.GITHUB_STEP_SUMMARY;
            const browser = process.env.BROWSER;

            if (!fs.existsSync("test-results.json")) {
              fs.appendFileSync(summaryFile, `### ⚠️ Vitest (${browser})\n\nNo test results found.\n`);
              process.exit(0);
            }

            const report = JSON.parse(fs.readFileSync("test-results.json", "utf8"));
            const status = report.success ? "✅ Passed" : "❌ Failed";
            const suites = report.testResults || [];
            const duration = (
              suites.reduce((acc, s) => acc + Math.max(0, (s.endTime || 0) - (s.startTime || 0)), 0) / 1000
            ).toFixed(2);

            let md = `### Vitest — \`${browser}\`\n\n`;
            md += `| Status | Suites | Passed | Failed | Skipped | Duration |\n`;
            md += `| :--- | :--- | :--- | :--- | :--- | :--- |\n`;
            md += `| **${status}** | ${report.numPassedTestSuites}/${report.numTotalTestSuites} | ${report.numPassedTests} | ${report.numFailedTests} | ${report.numPendingTests} | ${duration}s |\n\n`;

            for (const suite of suites) {
              for (const test of suite.assertionResults || []) {
                if (test.status === "failed") {
                  md += `<details open>\n<summary>❌ <strong>${path.basename(suite.name)}</strong> — ${test.fullName || test.title}</summary>\n\n`;
                  md += "```text\n" + (test.failureMessages || []).join("\n\n").trim() + "\n```\n\n</details>\n\n";
                }
              }
            }

            fs.appendFileSync(summaryFile, md);
          '
